name: Inspect NRO JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'NRO-Offline-1.0.4.jar'
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Record original JAR checksum
        run: sha256sum NRO-Offline-1.0.4.jar | tee jar.sha256

      - name: Extract JAR
        run: |
          mkdir -p out/classes out/src out/javap out/report/candidates
          unzip -tq NRO-Offline-1.0.4.jar
          unzip -q NRO-Offline-1.0.4.jar -d out/classes
          n=$(find out/classes -name '*.class' | wc -l)
          echo "classes: $n"
          test "$n" -gt 0

      - name: Download and verify CFR
        run: |
          curl -fsSL --retry 3 -o cfr.jar \
            https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          test -s cfr.jar
          unzip -tq cfr.jar
          unzip -l cfr.jar | grep -q 'org/benf/cfr/reader/Main.class'

      - name: Decompile with CFR
        run: |
          java -jar cfr.jar NRO-Offline-1.0.4.jar --outputdir out/src
          test "$(find out/src -name '*.java' | wc -l)" -gt 0

      - name: Dump bytecode with javap (all classes)
        run: |
          find out/classes -name '*.class' -print0 | while IFS= read -r -d '' f; do
            c="${f#out/classes/}"; c="${c%.class}"
            javap -c -p -constants -cp out/classes "$c" > "out/javap/$(echo "$c" | tr '/$' '__').txt"
          done
          test "$(ls out/javap | wc -l)" -gt 0

      - name: Export targeted javap
        run: |
          mkdir -p out/targeted
          : > out/targeted/MISSING.txt
          : > out/targeted/FOUND.txt
          # A target matches its own javap file and its inner classes (Name_*.txt).
          for n in Il1I Il_l_III1_II Il_l I1Il I101 IOIl IO_l II0l II1I IOOo; do
            found=0
            for f in out/javap/"$n".txt out/javap/"$n"_*.txt; do
              if [ -f "$f" ]; then
                cp "$f" out/targeted/
                echo "$(basename "$f")" >> out/targeted/FOUND.txt
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "$n" >> out/targeted/MISSING.txt
              echo "::warning::Target class not found: $n"
            fi
          done
          sort -u -o out/targeted/FOUND.txt out/targeted/FOUND.txt
          echo "found:"; cat out/targeted/FOUND.txt
          echo "missing:"; cat out/targeted/MISSING.txt
          # Fail if no real bytecode was exported.
          test "$(grep -c . out/targeted/FOUND.txt)" -gt 0
          for f in $(cat out/targeted/FOUND.txt); do test -s "out/targeted/$f"; done

      - name: Create and verify NRO-Targeted-Javap.zip
        run: |
          (cd out && zip -qr ../NRO-Targeted-Javap.zip targeted)
          test -s NRO-Targeted-Javap.zip
          unzip -t NRO-Targeted-Javap.zip > /dev/null
          ls -l NRO-Targeted-Javap.zip
          # Truncation check: every file on disk must be listed with its full size.
          python3 - <<'PY'
          import zipfile, os
          z = zipfile.ZipFile('NRO-Targeted-Javap.zip')
          assert z.testzip() is None, 'corrupt entry'
          disk = {}
          for r, _, fs in os.walk('out/targeted'):
              for f in fs:
                  p = os.path.join(r, f)
                  disk['targeted/' + os.path.relpath(p, 'out/targeted')] = os.path.getsize(p)
          zipped = {i.filename: i.file_size for i in z.infolist() if not i.is_dir()}
          assert disk == zipped, 'zip content differs from disk (truncated?)'
          print('ZIP OK:', len(zipped), 'files,', sum(zipped.values()), 'bytes')
          PY

      - name: Collect reports
        run: |
          # grep exit 1 = no match (allowed); exit >=2 = real error.
          search() { grep "$@" || [ $? -eq 1 ]; }
          R=out/report

          # 4. Methods taking java.io.DataInputStream (class: signature)
          search -rE '^\s+[a-zA-Z].*\(.*java\.io\.DataInputStream.*\)' out/javap \
            | sed 's#^out/javap/##' | sort > $R/DataInputStream-classes.txt

          # 5. Packet read/write usage, count per class
          for k in readByte readShort readInt writeByte writeShort; do
            search -rc "java/io/Data[A-Za-z]*Stream\.$k" out/javap \
              | awk -F: -v k=$k '$2>0{print k"\t"$2"\t"$1}' | sed 's#out/javap/##'
          done | sort -k1,1 -k2,2nr > $R/Packet-classes.txt

          # 6. Decoder-like methods: static String f(String,int); and string constants
          #    Not decoded here on purpose; only recorded.
          {
            echo "## Decoder-like methods (static String(String,int))"
            search -rE 'static java\.lang\.String [A-Za-z0-9_]+\(java\.lang\.String, int\)' out/javap \
              | sed 's#^out/javap/##'
            echo
            echo "## Plain-text keyword hits in javap (set/kich/hoat/xung/conflict/activ)"
            search -rniE 'String .*(set|kich|k.ch|hoat|xung|conflict|activ)' out/javap \
              | sed 's#^out/javap/##'
            echo
            echo "## Classes referencing IOo_ / IO0_ and reading DataInputStream"
            for f in out/javap/*.txt; do
              if grep -q 'IOo_\|IO0_' "$f" && grep -q 'DataInputStream' "$f"; then basename "$f"; fi
            done
            echo
            echo "## Classes referencing IOo_ or IO0_ (any)"
            search -rlE 'IOo_|IO0_' out/javap | sed 's#^out/javap/##' | sort
          } > $R/Set-candidates.txt

          # javap files of candidate classes (both refs + DataInputStream)
          for f in out/javap/*.txt; do
            if grep -q 'IOo_\|IO0_' "$f" && grep -q 'DataInputStream' "$f"; then
              cp "$f" $R/candidates/
            fi
          done
          # Always include IOo_ and IO0_ themselves if present
          for n in IOo_ IO0_; do
            [ -f "out/javap/$n.txt" ] && cp "out/javap/$n.txt" $R/candidates/ || true
          done
          find out/classes -type f ! -name '*.class' | sort > $R/resources.txt

      - name: Build NRO-Inspection.md
        run: |
          R=out/report
          {
            echo "# NRO-Inspection"
            echo
            echo "- classes: $(find out/classes -name '*.class' | wc -l)"
            echo "- java sources: $(find out/src -name '*.java' | wc -l)"
            echo "- javap dumps: $(ls out/javap | wc -l)"
            echo "- candidate javap files: $(ls $R/candidates | wc -l)"
            echo "- DataInputStream method signatures: $(wc -l < $R/DataInputStream-classes.txt)"
            echo "- jar sha256: $(cut -d' ' -f1 jar.sha256)"
            echo
            echo "Reports: DataInputStream-classes.txt, Packet-classes.txt, Set-candidates.txt, candidates/"
            echo "Encrypted strings are not decoded; decoder-like methods are listed in Set-candidates.txt."
          } > out/NRO-Inspection.md
          cp out/NRO-Inspection.md out/report/
          test -s out/NRO-Inspection.md

      - name: Verify original JAR unchanged
        run: sha256sum -c jar.sha256

      - name: Create and verify NRO-Inspection.zip
        run: |
          (cd out && zip -qr ../NRO-Inspection.zip NRO-Inspection.md report javap src)
          test -s NRO-Inspection.zip
          unzip -t NRO-Inspection.zip > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: NRO-Inspection
          path: NRO-Inspection.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NRO-Targeted-Javap
          path: NRO-Targeted-Javap.zip
          if-no-files-found: error
